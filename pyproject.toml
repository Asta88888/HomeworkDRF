[tool.poetry]
name = "homeworkdrf"
version = "0.1.0"
description = ""
authors = ["Anastasiya Soloviova <mafanya.as@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
django = "^5.2.5"
pillow = "^11.3.0"
python-dotenv = "^1.1.1"
psycopg2-binary = "^2.9.10"
djangorestframework = "^3.16.1"
django-filter = "^25.1"
djangorestframework-simplejwt = "^5.5.1"
coverage = "^7.10.4"
drf-yasg = "^1.21.10"
stripe = "^12.4.0"
forex-python = "^1.9.2"
celery = "^5.5.3"
redis = "^6.4.0"
eventlet = "^0.40.3"
django-celery-beat = "^2.8.1"
gunicorn = "^23.0.0"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
black = "^25.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = ''' ( /( \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist )/
    | foo.py
      ) '''
